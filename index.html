<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 16px Arial;
            background: rgb(49, 37, 108);
            color: #fff;
        }

        header {
            padding: 24px;
            text-align: center;
        }

        header button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #fff;
            color: rgb(49, 37, 108);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        header button:hover {
            background: #ddd;
        }

        main {
            max-width: 950px;
            margin: auto;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .pokemon {
            overflow: hidden;
            background: #466aad;
            border-radius: 18px;
            box-shadow: 0 8px 25px #222;
            text-align: center;
            padding-bottom: 15px;
        }

        .pokemon img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            background: #fff;
        }

        .pokemon h3 {
            margin: 12px 0 5px;
            text-transform: capitalize;
        }

        .pokemon p {
            margin: 5px;
        }

        @media (max-width: 520px) {
            header {
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Pokédex</h1>
        <p>20 Pokémon aleatórios!</p>

        <button onclick="carregarPokemons()">
            Gerar novos Pokémon
        </button>
    </header>

    <main>
        <div class="grid" id="pokemons">
            Carregando Pokémon...
        </div>
    </main>

    <script>

        const API = "https://pokeapi.co/api/v2/pokemon/";

        async function carregarPokemon(numero) {

            const resposta = await fetch(API + numero);
            const pokemon = await resposta.json();

            return pokemon;
        }


        async function carregarPokemons() {

            const grid = document.querySelector("#pokemons");

            grid.innerHTML = "Carregando Pokémon...";

            const pokemons = [];

            for (let i = 0; i < 20; i++) {

                const numero = Math.floor(Math.random() * 1025) + 1;

                const pokemon = await carregarPokemon(numero);

                pokemons.push(pokemon);
            }

            grid.innerHTML = "";

            pokemons.forEach(pokemon => {

                const tipos = pokemon.types
                    .map(tipo => tipo.type.name)
                    .join(" / ");

                grid.innerHTML += `
                    <article class="pokemon">

                        <img
                            src="${pokemon.sprites.front_default}"
                            alt="${pokemon.name}"
                        >

                        <h3>${pokemon.name}</h3>

                        <p>#${pokemon.id}</p>

                        <p>Tipo: ${tipos}</p>

                    </article>
                `;
            });
        }

        carregarPokemons();

    </script>

</body>
</html>
